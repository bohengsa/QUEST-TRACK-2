<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응 속도 테스트</title>
<style>
  :root {
    --bg: #1b1d24;
    --panel: #262a33;
    --text: #f2f3f5;
    --muted: #a3a8b4;
    --idle: #3a6fd8;
    --wait: #d64545;
    --go: #2fb36a;
    --fail: #e0a020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 16px;
  }
  h1 { margin: 8px 0 0; font-size: 1.6rem; }
  .howto {
    max-width: 640px;
    width: 100%;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .howto b { color: var(--text); }
  .howto ol { margin: 4px 0; padding-left: 20px; }

  #pad {
    max-width: 640px;
    width: 100%;
    height: 300px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    background: var(--idle);
    transition: background 0.05s;
    padding: 16px;
  }
  #pad.wait { background: var(--wait); }
  #pad.go   { background: var(--go); }
  #pad.fail { background: var(--fail); color: #1b1d24; }
  #big { font-size: 2.4rem; font-weight: 800; }
  #small { font-size: 1.05rem; margin-top: 8px; opacity: 0.9; }

  .stats {
    max-width: 640px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat {
    background: var(--panel);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
  }
  .stat .label { font-size: 0.8rem; color: var(--muted); }
  .stat .value { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }

  .rounds {
    max-width: 640px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .round {
    background: var(--panel);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
    font-size: 0.95rem;
  }
  .round .n { font-size: 0.75rem; color: var(--muted); }
  .round.now { outline: 2px solid var(--idle); }

  button {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid #3a3f4b;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { color: var(--text); }
</style>
</head>
<body>
  <h1>⚡ 반응 속도 테스트</h1>

  <div class="howto">
    <b>사용법</b>
    <ol>
      <li>아래 파란 칸을 클릭하면 시작해요. (스페이스바도 돼요)</li>
      <li>칸이 <b style="color:var(--wait)">빨간색</b>이면 기다리세요.</li>
      <li><b style="color:var(--go)">초록색</b>으로 바뀌는 순간 최대한 빨리 클릭!</li>
      <li>초록색이 되기 전에 누르면 <b style="color:var(--fail)">실패</b> — 그 판은 다시 해요.</li>
      <li>5번 재서 평균을 내고, 가장 좋은 평균은 자동으로 저장돼요.</li>
    </ol>
  </div>

  <div id="pad">
    <div id="big">클릭해서 시작</div>
    <div id="small">5번 재서 평균을 냅니다</div>
  </div>

  <div class="rounds" id="rounds"></div>

  <div class="stats">
    <div class="stat"><div class="label">이번 평균</div><div class="value" id="avg">-</div></div>
    <div class="stat"><div class="label">최고 평균 (저장됨)</div><div class="value" id="bestAvg">-</div></div>
    <div class="stat"><div class="label">최고 한 번 (저장됨)</div><div class="value" id="bestOne">-</div></div>
  </div>

  <button id="reset">저장된 최고 기록 지우기</button>

<script>
  const TOTAL = 5;
  const pad = document.getElementById("pad");
  const big = document.getElementById("big");
  const small = document.getElementById("small");
  const roundsEl = document.getElementById("rounds");
  const avgEl = document.getElementById("avg");
  const bestAvgEl = document.getElementById("bestAvg");
  const bestOneEl = document.getElementById("bestOne");

  // 상태: idle(시작 전) → wait(빨강) → go(초록) → result(한 판 결과) / fail(너무 빨리) → done(5판 끝)
  let state = "idle";
  let times = [];
  let timer = null;
  let goAt = 0;

  function load(key) {
    try { const v = localStorage.getItem(key); return v ? Number(v) : null; } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) {}
  }

  let bestAvg = load("reaction-best-avg");
  let bestOne = load("reaction-best-one");

  function ms(v) { return v == null ? "-" : Math.round(v) + "ms"; }

  function show(cls, bigText, smallText) {
    pad.className = cls;
    big.textContent = bigText;
    small.textContent = smallText;
  }

  function drawRounds() {
    roundsEl.innerHTML = "";
    for (let i = 0; i < TOTAL; i++) {
      const d = document.createElement("div");
      d.className = "round" + (i === times.length && state !== "done" && state !== "idle" ? " now" : "");
      d.innerHTML = '<div class="n">' + (i + 1) + '번</div><div>' + (times[i] != null ? ms(times[i]) : "·") + "</div>";
      roundsEl.appendChild(d);
    }
    avgEl.textContent = times.length ? ms(times.reduce((a, b) => a + b, 0) / times.length) : "-";
    bestAvgEl.textContent = ms(bestAvg);
    bestOneEl.textContent = ms(bestOne);
  }

  function startWait() {
    state = "wait";
    show("wait", "기다리세요…", "초록색이 되면 클릭!");
    const delay = 1500 + Math.random() * 3000; // 1.5초 ~ 4.5초 사이 무작위
    timer = setTimeout(() => {
      state = "go";
      goAt = performance.now();
      show("go", "지금 클릭!", "");
    }, delay);
    drawRounds();
  }

  function press() {
    if (state === "idle" || state === "done") {
      times = [];
      startWait();
    } else if (state === "wait") {
      clearTimeout(timer);
      state = "fail";
      show("fail", "너무 빨라요! 실패", "초록색이 된 뒤에 눌러야 해요. 클릭하면 이 판을 다시 해요");
    } else if (state === "go") {
      const t = performance.now() - goAt;
      times.push(t);
      if (bestOne == null || t < bestOne) { bestOne = t; save("reaction-best-one", t); }

      if (times.length < TOTAL) {
        state = "result";
        show("", ms(t), times.length + " / " + TOTAL + "번 · 클릭하면 다음 판");
      } else {
        const avg = times.reduce((a, b) => a + b, 0) / TOTAL;
        let msg = "클릭하면 처음부터 다시";
        if (bestAvg == null || avg < bestAvg) {
          bestAvg = avg;
          save("reaction-best-avg", avg);
          msg = "🎉 새 최고 기록! · " + msg;
        }
        state = "done";
        show("", "평균 " + ms(avg), msg);
      }
      drawRounds();
    } else if (state === "result" || state === "fail") {
      startWait();
    }
  }

  // 마우스·터치는 누르는 순간(pointerdown)에 재야 더 정확해요
  pad.addEventListener("pointerdown", press);
  document.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "Enter") && !e.repeat) {
      e.preventDefault();
      press();
    }
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("저장된 최고 기록을 지울까요?")) return;
    bestAvg = null; bestOne = null;
    try { localStorage.removeItem("reaction-best-avg"); localStorage.removeItem("reaction-best-one"); } catch (e) {}
    drawRounds();
  });

  drawRounds();
</script>
</body>
</html>
